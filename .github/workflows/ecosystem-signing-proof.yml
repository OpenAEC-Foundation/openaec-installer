name: Sign audited Windows installer copies
on:
  push:
    branches: [codex/ecosystem-signature-audit-20261029]
    paths: ['tools/signature-audit/unsigned-windows.json', '.github/workflows/ecosystem-signing-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign-copies:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check existing organization signing configuration
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        run: |
          $missing = @('AZURE_TENANT_ID','AZURE_CLIENT_ID','AZURE_CLIENT_SECRET','AZURE_ENDPOINT','AZURE_TRUSTED_SIGNING_ACCOUNT_NAME','AZURE_CERTIFICATE_PROFILE_NAME') | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing.Count) { throw "Signing configuration unavailable to this repository: $($missing -join ', ')" }
      - name: Download only audited assets and verify original SHA256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content tools/signature-audit/unsigned-windows.json -Raw | ConvertFrom-Json
          foreach ($asset in $manifest) {
            if ($asset.repo -notmatch '^OpenAEC-Foundation/[A-Za-z0-9_.-]+$' -or $asset.name -notmatch '\.(exe|msi|dll)$') { throw 'Unexpected artifact source or type' }
            $dir = Join-Path 'signed-copies' "$($asset.repo.Split('/')[1])/$($asset.tag)"
            New-Item -ItemType Directory -Force $dir | Out-Null
            gh release download $asset.tag --repo $asset.repo --pattern $asset.name --dir $dir
            if ($LASTEXITCODE) { throw 'Release download failed' }
            $file = Join-Path $dir $asset.name
            if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.sha256) { throw "Original hash mismatch: $($asset.name)" }
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'NotSigned') { throw "Asset is no longer unsigned: $($asset.name): $($signature.Status)" }
          }
      - name: Sign audited copies with existing Azure account
        uses: azure/trusted-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}/signed-copies
          files-folder-filter: exe,msi,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signatures and timestamps
        shell: pwsh
        run: |
          $results = foreach ($file in Get-ChildItem signed-copies -Recurse -File) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) { throw "Invalid or untimestamped signature: $($file.FullName): $($sig.Status)" }
            [ordered]@{ file = $file.FullName.Substring((Get-Location).Path.Length + 1); status = "$($sig.Status)"; publisher = $sig.SignerCertificate.Subject; thumbprint = $sig.SignerCertificate.Thumbprint; timestamp = $sig.TimeStamperCertificate.Subject; sha256 = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $results | ConvertTo-Json -Depth 5 | Set-Content signed-copies/signature-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: signed-installer-copies
          path: signed-copies/
          if-no-files-found: error
