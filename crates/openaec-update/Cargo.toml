[package]
name = "openaec-update"
version = "0.1.0"
edition = "2021"
description = "Updates through the OpenAEC Installer: the notice and Bijwerken for Tauri apps"
# The contract comes from openaec-ui in OpenAEC-Blueprint, under the same licence.
license = "LGPL-3.0-only"
links = "openaec-update"

[features]
default = ["tauri"]
# The Tauri plugin; without it only the contract (status file, versions, installer).
tauri = ["dep:tauri"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, optional = true }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
